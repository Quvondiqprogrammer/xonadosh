<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="XonaDosh — talabalar uchun uy-joy, xonadosh moslash va birga yashash.">
  <meta name="theme-color" content="#059669">

  <meta property="og:title" content="XonaDosh">
  <meta property="og:description" content="Universitet yonida uy va ishonchli xonadosh">
  <meta property="og:image" content="https://honadosh.uz/assets/brand/xonadosh_logo_ui.png">
  <meta property="og:url" content="https://honadosh.uz/app/">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XonaDosh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>XonaDosh</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ecfdf5;
      overflow: hidden;
    }
    .xd-boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #065f46;
    }
    .xd-boot img {
      width: 88px; height: 88px; border-radius: 22px;
      box-shadow: 0 12px 28px rgba(5,150,105,.22);
      object-fit: cover; background: #fff;
    }
    .xd-boot span { font-weight: 700; font-size: 14px; opacity: .75; }
  </style>
</head>
<body>
  <div class="xd-boot" id="xd-boot">
    <img src="icons/Icon-192.png" alt="XonaDosh" width="88" height="88">
    <span>Yuklanmoqda…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('xd-boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
